spring.application.name=demo

# Render sets PORT; locally it falls back to 8080
server.port=${PORT:8080}

# Supabase Postgres connection (set these as environment variables, never commit the password)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# Creates/updates the chapter_progress table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated frontend URLs allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Run schema.sql on startup (before Hibernate updates the table)
spring.sql.init.mode=always
